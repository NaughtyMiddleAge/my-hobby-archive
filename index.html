
<!DOCTYPE html>
<html lang="ko">
<head>

    <link rel="stylesheet" href="style.css">
</head>

    <!-- 상단 메뉴 -->

    <!-- 메인 콘텐츠 -->

        </section>

        <!-- 취미 메뉴 -->
        <section class="hobby-section">

            <div class="hobby-card hiking">
                <h3>HIKING</h3>

            </div>

            <div class="hobby-card playstation">
                <h3>PLAYSTATION</h3>

        </section>

    </main>

    <script src="script.js"></script>
