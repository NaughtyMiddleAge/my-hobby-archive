
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY HOBBY ARCHIVE</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 상단 메뉴 -->

    <header class="header">
    
        <h1 class="logo">MY ARCHIVE</h1>
    
        <nav class="nav-menu">
            <a href="index.html">HOME</a>
            <a href="hiking.html">HIKING</a>
            <a href="#playstation">PLAYSTATION</a>
        </nav>
    
        <button class="menu-button" aria-label="메뉴 열기">
            ☰
        </button>
    
    </header>


    <!-- 메인 콘텐츠 -->
    <main>

        <!-- 소개 영역 -->
        <section class="intro">
            <p>PERSONAL DASHBOARD</p>
            <h2>나의 취미 기록</h2>
            <p>일상의 취미와 경험을 기록하는 공간</p>
        </section>

        <!-- 취미 메뉴 -->
        <section class="hobby-section">

            <a href="hiking.html" class="hobby-card hiking" id="hiking">
                <h3>HIKING</h3>
                <p>등산 기록 관리</p>
            </a>

            <div class="hobby-card playstation" id="playstation">
                <h3>PLAYSTATION</h3>
                <p>게임 기록 관리</p>
            </div>

        </section>
        
        <!-- 활동 통계 영역 -->
        <section class="activity-section">

            <h2>MY ACTIVITY</h2>

            <div class="activity-grid">

                <div class="activity-card">
                    <h3>13</h3>
                    <p>Hiking Records</p>
                    <span>누적 완등 산</span>
                </div>

                <div class="activity-card">
                    <h3>12</h3>
                    <p>PlayStation Games</p>
                    <span>등록된 게임</span>
                </div>

            </div>

        </section>


    </main>

    <script src="script.js"></script>

</body>
</html>
